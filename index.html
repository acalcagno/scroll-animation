<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moto Scroll</title>
    <style>
        *,*::before, *::after {
            box-sizing: border-box;
        }
        body {
            margin: 0;
        }

        img {
            width: 50vw;
            height: 50vw;
            object-fit: cover;
            position: fixed;
        }

        main {
            height: 300dvh;
        }

        header {
            width: 300px;
            height: 300px;
            background: #000;
            width: 500px;
            height: 500px;
            border-radius: 1000px;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1;
            margin-top: -250px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            animation: slideInDown;
            animation-duration: 1s;
            animation: slideInDown 1500ms ease-out;
            img {
                width: 230px;
                margin: 0 auto;
                height: auto;
                margin: 30px;
            }
        }

        @keyframes slideInDown {
            from {
                transform: translate3d(-50%, -100%, 0);

            }
            to {
                transform: translate3d(-50%, 0, 0);
            }
        }
    </style>

<script type="module">
    import { images } from './images.js'

    const main = document.querySelector('main')
    const MAX_FRAMES = 77
    let currentFrame = 0

    function updateImage(frame = 0) {
      const src = images[frame].p
      img.src = src
    }

    // init with the first image
    const img = document.createElement('img')
    // append img to main
    main.appendChild(img)
    updateImage(currentFrame)

    // Altura máxima del scroll
    let maxScroll = document.documentElement.scrollHeight - window.innerHeight;

    window.addEventListener('resize', () => {
      maxScroll = document.documentElement.scrollHeight - window.innerHeight;
    });

    let lastFrameUpdate = 0

    window.addEventListener('scroll', () => {
      if (Date.now() - lastFrameUpdate < 1) return true
      // Actualizamos el contador
      lastFrameUpdate = Date.now()
      // Posición actual del scroll
      const scrollPosition = window.scrollY
      // Calcular el porcentaje del scroll
      const scrollFraction = scrollPosition / maxScroll;
      // ¿Qué frame le toca?
      const frame = Math.floor(scrollFraction * MAX_FRAMES)
      // nos evitemos algo de trabajo cuando
      // al hacer scroll, el frame que le toca es el mismo
      // que ya tenía
      if (currentFrame !== frame) {
        // creamos el id del nombre del archivo
        updateImage(frame)
        currentFrame = frame
      }
    });
  </script>

</head>
<body>
    <main>
        <header>
            <img src="logo.png" alt="dusty-logo">
        </header>
        <img id="video" src="./frames/ezgif-frame-001_11zon.webp" ></img>
    </main>

</body>
</html>
